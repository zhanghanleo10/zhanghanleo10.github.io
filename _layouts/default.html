<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#ffffff">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.math %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <div class="shell nav-shell">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
          <span class="brand-avatar" aria-hidden="true">TH</span>
          <span class="brand-text">
            <strong>{{ site.title }}</strong>
            <small>Research · Systems · Engineering</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/archive/' | relative_url }}">文章</a>
          <a href="{{ '/npu/' | relative_url }}">NPU</a>
          <a href="{{ '/about/' | relative_url }}">关于</a>
          <a class="github-link" href="https://github.com/zhanghanleo10" target="_blank" rel="noreferrer">GitHub ↗</a>
        </nav>
      </div>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <div>
          <strong>{{ site.title }}</strong>
          <p>记录大模型推理、生成式推荐、训练与强化学习、AI 编译及加速器算子。</p>
        </div>
        <span>© {{ 'now' | date: '%Y' }} · Built with Jekyll & GitHub Pages</span>
      </div>
    </footer>
  </body>
</html>
