<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="utility-bar">
        <div class="shell utility-inner">
          <span>写给未来的自己，也分享给同路的人</span>
          <nav aria-label="辅助导航">
            <a href="{{ '/about/' | relative_url }}">关于</a>
            <a href="{{ '/archive/' | relative_url }}">归档</a>
          </nav>
        </div>
      </div>

      <div class="shell brand-row">
        <a class="brand-copy" href="{{ '/' | relative_url }}">
          <span class="eyebrow">PERSONAL TECH NOTES</span>
          <strong>{{ site.title }}</strong>
          <small>{{ site.description }}</small>
        </a>
        <div class="brand-mark" aria-hidden="true"><span>TH</span></div>
      </div>

      <nav class="category-nav" aria-label="主导航">
        <div class="shell category-inner">
          <a href="{{ '/' | relative_url }}">首页</a>
          <a href="{{ '/archive/' | relative_url }}">文章归档</a>
          <a href="{{ '/about/' | relative_url }}">关于本站</a>
        </div>
      </nav>
    </header>

    <main>{{ content }}</main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>© {{ 'now' | date: '%Y' }} {{ site.title }} · 保持好奇，持续深入</p>
        <a href="{{ '/' | relative_url }}">返回首页</a>
      </div>
    </footer>
  </body>
</html>
