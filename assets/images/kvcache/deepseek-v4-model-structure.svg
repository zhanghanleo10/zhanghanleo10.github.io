<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4 在 vLLM 中的模型结构</title>
  <desc id="desc">左侧展示从 token embedding、mHC 四流 Decoder 主干到 LM Head 的完整路径，并把可选 MTP 画成旁路；右侧放大单个 Decoder Layer 的 mHC、Sparse MLA 与 MoE，并对比 SWA-only、C4、C128 三类 Attention。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef8f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#49677d"/>
    </marker>
    <style>
      .title{font:700 34px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#172033}
      .subtitle{font:400 18px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#56697a}
      .section{font:700 23px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#172033}
      .label{font:650 19px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#20364a}
      .small{font:400 17px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#56697a}
      .tiny{font:500 15px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#607284}
      .white{font:700 18px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#fff}
      .arrow{stroke:#49677d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#7b8793;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="900" rx="28" fill="url(#bg)"/>
  <text id="titleText" x="600" y="50" text-anchor="middle" class="title">DeepSeek V4：mHC 四流主干 + Sparse MLA + 全层 MoE</text>
  <text x="600" y="80" text-anchor="middle" class="subtitle">模型结构图回答“token 怎样流过模型”；缓存 page 的物理组织见文中的 KVCache 地图</text>

  <!-- Left: end-to-end target model -->
  <g filter="url(#shadow)">
    <rect x="42" y="112" width="292" height="668" rx="22" fill="#ffffff" stroke="#d8e4ec"/>
  </g>
  <text x="188" y="147" text-anchor="middle" class="section">Target 主模型</text>

  <rect x="81" y="166" width="214" height="43" rx="11" fill="#e9f2f8" stroke="#a9c6d8"/>
  <text x="188" y="193" text-anchor="middle" class="label">Input token IDs</text>
  <path class="arrow" d="M188 209 V225"/>
  <rect x="71" y="227" width="234" height="52" rx="11" fill="#e7f3fb" stroke="#8ebed8"/>
  <text x="188" y="250" text-anchor="middle" class="label">Vocab Embedding</text>
  <text x="188" y="270" text-anchor="middle" class="tiny">得到 1 条 hidden stream</text>
  <path class="arrow" d="M188 279 V295"/>

  <rect x="67" y="297" width="242" height="65" rx="12" fill="#e7eefb" stroke="#889fcd"/>
  <text x="188" y="322" text-anchor="middle" class="label">首层 mHC pre-broadcast</text>
  <text x="188" y="345" text-anchor="middle" class="small">1 条 → 4 条 residual streams</text>
  <path class="arrow" d="M188 362 V378"/>

  <rect x="61" y="380" width="254" height="169" rx="15" fill="#f6f4fd" stroke="#a8a0d8" stroke-width="2"/>
  <text x="188" y="408" text-anchor="middle" class="label">Decoder Stack</text>
  <text x="188" y="433" text-anchor="middle" class="small">Flash：43 层　Pro：61 层</text>
  <rect x="82" y="449" width="212" height="35" rx="9" fill="#ece8fa"/>
  <text x="188" y="472" text-anchor="middle" class="small">每层：Sparse MLA + MoE</text>
  <rect x="82" y="493" width="212" height="35" rx="9" fill="#fff1da"/>
  <text x="188" y="516" text-anchor="middle" class="small">前 3 层 Hash-MoE</text>
  <text x="188" y="540" text-anchor="middle" class="tiny">其余层 Gated-MoE</text>
  <path class="arrow" d="M188 549 V565"/>

  <rect x="71" y="567" width="234" height="57" rx="11" fill="#e7eefb" stroke="#889fcd"/>
  <text x="188" y="591" text-anchor="middle" class="label">mHC Head</text>
  <text x="188" y="614" text-anchor="middle" class="small">4 条流收拢为 1 条</text>
  <path class="arrow" d="M188 624 V640"/>
  <rect x="81" y="642" width="214" height="43" rx="11" fill="#e9f8f4" stroke="#75b9ad"/>
  <text x="188" y="669" text-anchor="middle" class="label">Final RMSNorm</text>
  <path class="arrow" d="M188 685 V701"/>
  <rect x="81" y="703" width="214" height="43" rx="11" fill="#173b57"/>
  <text x="188" y="730" text-anchor="middle" class="white">Parallel LM Head</text>
  <path class="arrow" d="M188 746 V758"/>
  <text x="188" y="774" text-anchor="middle" class="small">Next-token logits</text>

  <!-- Optional MTP sidecar -->
  <path class="dash" d="M61 549 H47 V820 H72"/>
  <rect x="72" y="794" width="238" height="66" rx="12" fill="#fffaf0" stroke="#d5a947" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="191" y="819" text-anchor="middle" class="label">可选：1 层 MTP draft</text>
  <text x="191" y="843" text-anchor="middle" class="small">投机推理旁路；不计入 43 / 61 层</text>

  <!-- Right: one decoder layer -->
  <g filter="url(#shadow)">
    <rect x="360" y="112" width="798" height="354" rx="22" fill="#ffffff" stroke="#d8e4ec"/>
  </g>
  <text x="759" y="147" text-anchor="middle" class="section">放大一个 DeepseekV4DecoderLayer</text>
  <text x="759" y="171" text-anchor="middle" class="small">淡色四线是 mHC residual highway：它是多流混合，不是普通 Transformer 的单个 Add</text>

  <g opacity="0.9">
    <path d="M391 199 H1127" stroke="#9fb4e1" stroke-width="8" stroke-linecap="round"/>
    <path d="M391 213 H1127" stroke="#a9d7cf" stroke-width="8" stroke-linecap="round"/>
    <path d="M391 227 H1127" stroke="#e5c989" stroke-width="8" stroke-linecap="round"/>
    <path d="M391 241 H1127" stroke="#c7b5df" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="400" y="192" class="tiny">4-stream mHC residual</text>

  <rect x="390" y="264" width="166" height="78" rx="12" fill="#e7eefb" stroke="#889fcd"/>
  <text x="473" y="292" text-anchor="middle" class="label">mHC pre-mix</text>
  <text x="473" y="318" text-anchor="middle" class="small">+ Attn RMSNorm</text>
  <path class="arrow" d="M556 303 H581"/>
  <rect x="583" y="264" width="166" height="78" rx="12" fill="#e5f5f0" stroke="#63b7a7"/>
  <text x="666" y="292" text-anchor="middle" class="label">Sparse MLA</text>
  <text x="666" y="318" text-anchor="middle" class="small">SWA + 可选压缩</text>
  <path class="arrow" d="M749 303 H774"/>
  <rect x="776" y="264" width="166" height="78" rx="12" fill="#e7eefb" stroke="#889fcd"/>
  <text x="859" y="292" text-anchor="middle" class="label">mHC mix</text>
  <text x="859" y="318" text-anchor="middle" class="small">+ FFN RMSNorm</text>
  <path class="arrow" d="M942 303 H967"/>
  <rect x="969" y="264" width="160" height="78" rx="12" fill="#fff2dd" stroke="#d5a947"/>
  <text x="1049" y="292" text-anchor="middle" class="label">MoE FFN</text>
  <text x="1049" y="318" text-anchor="middle" class="small">每个主干层都有</text>

  <rect x="458" y="371" width="604" height="61" rx="13" fill="#fbf8ef" stroke="#ead8ac"/>
  <text x="760" y="396" text-anchor="middle" class="label">Hash / learned router → Top-6 routed　+　1 shared expert</text>
  <text x="760" y="419" text-anchor="middle" class="small">Flash：256 routed experts　｜　Pro：384 routed experts</text>
  <text x="759" y="454" text-anchor="middle" class="tiny">FFN delta 在下一层开头混回四流 residual；最后一层由模型尾部的 mHC post 收尾</text>

  <!-- Right bottom: three attention variants -->
  <text x="759" y="504" text-anchor="middle" class="section">同一 Decoder 骨架中的三种 Attention / 记忆分辨率</text>
  <rect x="457" y="516" width="604" height="34" rx="17" fill="#e7f3fb" stroke="#96c6df"/>
  <text x="759" y="539" text-anchor="middle" class="small">共同底座：每层都精确保留最近 128 token 的 SWA</text>

  <g filter="url(#shadow)">
    <rect x="366" y="571" width="244" height="196" rx="18" fill="#ffffff" stroke="#cddce5"/>
    <rect x="637" y="571" width="244" height="196" rx="18" fill="#ffffff" stroke="#98cfc5"/>
    <rect x="908" y="571" width="244" height="196" rx="18" fill="#ffffff" stroke="#b9b2de"/>
  </g>
  <text x="488" y="604" text-anchor="middle" class="section">SWA-only / R1</text>
  <text x="488" y="634" text-anchor="middle" class="small">只有最近 128 token</text>
  <text x="488" y="658" text-anchor="middle" class="small">没有长期 Compressor</text>
  <rect x="394" y="681" width="188" height="31" rx="15" fill="#edf3f7"/>
  <text x="488" y="702" text-anchor="middle" class="small">Flash 2 层｜Pro 0 层</text>
  <text x="488" y="742" text-anchor="middle" class="tiny">配置 0 在 vLLM 中映射为 R1</text>

  <text x="759" y="604" text-anchor="middle" class="section">C4</text>
  <text x="759" y="634" text-anchor="middle" class="small">每 4 token 形成压缩历史</text>
  <text x="759" y="658" text-anchor="middle" class="small">唯一带 Lightning Indexer</text>
  <rect x="665" y="681" width="188" height="31" rx="15" fill="#e5f5f0"/>
  <text x="759" y="702" text-anchor="middle" class="small">Flash 21 层｜Pro 30 层</text>
  <text x="759" y="742" text-anchor="middle" class="tiny">Indexer 为当前 query 选择远端 top-k</text>

  <text x="1030" y="604" text-anchor="middle" class="section">C128</text>
  <text x="1030" y="634" text-anchor="middle" class="small">每 128 token 形成全局锚点</text>
  <text x="1030" y="658" text-anchor="middle" class="small">有 Compressor；没有 Indexer</text>
  <rect x="936" y="681" width="188" height="31" rx="15" fill="#eeebfa"/>
  <text x="1030" y="702" text-anchor="middle" class="small">Flash 20 层｜Pro 31 层</text>
  <text x="1030" y="742" text-anchor="middle" class="tiny">C4/C128 是时间压缩比，不是 head 数</text>

  <rect x="371" y="790" width="781" height="50" rx="13" fill="#173b57"/>
  <text x="761" y="813" text-anchor="middle" class="white">层型只改变 Attention / KV 路径；mHC 与 MoE 主体保持相同</text>
  <text x="761" y="833" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Inter, sans-serif" font-size="14" fill="#dceaf2">Flash H=4096 · Pro H=7168 · Attention head_dim=512</text>

  <text x="600" y="882" text-anchor="middle" class="tiny">概念图，非按比例 · 源码基线：vLLM main@6accb779</text>
</svg>
