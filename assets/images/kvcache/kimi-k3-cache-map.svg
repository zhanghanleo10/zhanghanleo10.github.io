<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 的 MLA 与 KDA 混合缓存</title>
  <desc id="desc">Kimi K3 的 93 层由 24 层 MLA 和 69 层 KDA 组成。MLA 为每个 token 保存 576 维 latent，随上下文长度增长；KDA 只保存卷积状态和递归矩阵，主要随并发请求数增长。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f5f2fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b6b82"/>
    </marker>
    <style>
      .title{font:700 34px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#172033}
      .subtitle{font:400 19px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#5b6b7c}
      .card-title{font:700 28px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#172033}
      .label{font:600 21px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#26384a}
      .small{font:400 17px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#5b6b7c}
      .badge{font:700 17px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Inter,sans-serif;fill:#0f5f58}
      .arrow{stroke:#4b6b82;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" class="title">Kimi K3：把“逐 token 记忆”与“递归状态”混在同一模型</text>
  <text x="600" y="91" text-anchor="middle" class="subtitle">93 层不是 93 份普通 KV：24 层保存 latent 历史，69 层保存固定大小的运行状态</text>

  <g transform="translate(88,130)">
    <text x="0" y="0" class="label">典型四层节奏</text>
    <rect x="0" y="25" width="185" height="48" rx="10" fill="#eeeafa" stroke="#aaa4db"/>
    <rect x="195" y="25" width="185" height="48" rx="10" fill="#eeeafa" stroke="#aaa4db"/>
    <rect x="390" y="25" width="185" height="48" rx="10" fill="#eeeafa" stroke="#aaa4db"/>
    <rect x="585" y="25" width="185" height="48" rx="10" fill="#ddf3ec" stroke="#63b7a7"/>
    <text x="92" y="56" text-anchor="middle" class="label">KDA</text>
    <text x="287" y="56" text-anchor="middle" class="label">KDA</text>
    <text x="482" y="56" text-anchor="middle" class="label">KDA</text>
    <text x="677" y="56" text-anchor="middle" class="label">MLA</text>
    <text x="805" y="56" class="small">重复到第 92 层</text>
    <rect x="965" y="25" width="115" height="48" rx="10" fill="#ddf3ec" stroke="#63b7a7"/>
    <text x="1022" y="56" text-anchor="middle" class="label">第 93 层 MLA</text>
  </g>

  <path class="arrow" d="M405 226 L405 270"/>
  <path class="arrow" d="M795 226 L795 270"/>

  <g filter="url(#shadow)">
    <rect x="80" y="274" width="500" height="350" rx="22" fill="#ffffff" stroke="#bcded9"/>
    <rect x="620" y="274" width="500" height="350" rx="22" fill="#ffffff" stroke="#d7d3ef"/>
  </g>

  <text x="330" y="321" text-anchor="middle" class="card-title">24 层 MLA：token 级 latent cache</text>
  <rect x="132" y="353" width="396" height="82" rx="14" fill="#e7f7f1" stroke="#63b7a7"/>
  <text x="330" y="386" text-anchor="middle" class="label">每个 token：cKV 512 + kPE 64</text>
  <text x="330" y="417" text-anchor="middle" class="small">BF16 时 1,152 B / token / MLA 层</text>
  <g transform="translate(132,463)">
    <rect x="0" y="0" width="48" height="62" rx="7" fill="#d9f0e8"/>
    <rect x="57" y="0" width="48" height="62" rx="7" fill="#d9f0e8"/>
    <rect x="114" y="0" width="48" height="62" rx="7" fill="#d9f0e8"/>
    <rect x="171" y="0" width="48" height="62" rx="7" fill="#d9f0e8"/>
    <rect x="228" y="0" width="48" height="62" rx="7" fill="#d9f0e8"/>
    <rect x="285" y="0" width="48" height="62" rx="7" fill="#d9f0e8"/>
    <rect x="342" y="0" width="48" height="62" rx="7" fill="#d9f0e8"/>
    <text x="195" y="88" text-anchor="middle" class="small">上下文越长，token page 越多</text>
  </g>
  <rect x="180" y="570" width="300" height="34" rx="17" fill="#e7f7f1"/>
  <text x="330" y="593" text-anchor="middle" class="badge">主要按序列长度 L 增长：O(L)</text>

  <text x="870" y="321" text-anchor="middle" class="card-title">69 层 KDA：运行状态页</text>
  <rect x="672" y="353" width="396" height="72" rx="14" fill="#f0eefb" stroke="#aaa4db"/>
  <text x="870" y="383" text-anchor="middle" class="label">Conv State</text>
  <text x="870" y="411" text-anchor="middle" class="small">短卷积窗口 · 默认随模型 dtype</text>
  <rect x="672" y="445" width="396" height="91" rx="14" fill="#e7e4f7" stroke="#9289cf"/>
  <text x="870" y="479" text-anchor="middle" class="label">Recurrent Matrix</text>
  <text x="870" y="508" text-anchor="middle" class="small">[96 / TP, 128, 128] · 强制 FP32</text>
  <rect x="720" y="570" width="300" height="34" rx="17" fill="#eeebfa"/>
  <text x="870" y="593" text-anchor="middle" class="badge">主要按并发请求数增长：近似 O(1) / 请求</text>

  <path class="arrow" d="M330 625 L330 672 L600 672"/>
  <path class="arrow" d="M870 625 L870 672 L600 672"/>
  <rect x="380" y="660" width="440" height="58" rx="29" fill="#173b57"/>
  <text x="600" y="696" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Inter, sans-serif" font-size="21" font-weight="700" fill="#ffffff">vLLM 对齐 page 大小，再交给统一 BlockPool 调度</text>
</svg>
