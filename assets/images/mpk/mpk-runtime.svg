<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="MPK 论文重点（三）：GPU 内部运行时">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#123a70" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2463d4"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f8f95"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7356c8"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="66" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="44" font-weight="800" fill="#111827">MPK 论文重点（三）：GPU 内部运行时</text>
<text x="800" y="112" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" font-weight="650" fill="#1959bc">Worker / Scheduler / Event 如何协同执行</text>
<line x1="250" y1="105" x2="395" y2="105" stroke="#8db8f1" stroke-width="2"/><circle cx="405" cy="105" r="6" fill="#6ea3e8"/>
<line x1="1205" y1="105" x2="1350" y2="105" stroke="#8db8f1" stroke-width="2"/><circle cx="1195" cy="105" r="6" fill="#6ea3e8"/>
<rect x="28" y="155" width="1180" height="645" rx="24" fill="#fbfdff" stroke="#2463d4" stroke-width="2" filter="url(#shadow)"/><rect x="1230" y="155" width="342" height="645" rx="24" fill="#fbfefd" stroke="#0f8f95" stroke-width="2" filter="url(#shadow)"/><rect x="500" y="138" width="180" height="50" rx="18" fill="#2463d4" stroke="#2463d4" stroke-width="0"/><text x="590" y="172" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="24" font-weight="800" fill="#fff">GPU Runtime</text><rect x="70" y="380" width="245" height="110" rx="16" fill="#eef3ff" stroke="#2463d4" stroke-width="1.8" filter="url(#shadow)"/><text x="192.5" y="420" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="800" fill="#2463d4">Worker Queue</text><text x="192.5" y="456" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16" font-weight="550" fill="#4b5563">等待执行的 Task</text><rect x="350" y="380" width="210" height="110" rx="16" fill="#eefafa" stroke="#0f8f95" stroke-width="1.8" filter="url(#shadow)"/><text x="455.0" y="420" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="800" fill="#0f8f95">Worker</text><text x="455.0" y="456" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16" font-weight="550" fill="#4b5563">执行计算或通信</text><rect x="605" y="380" width="230" height="110" rx="16" fill="#f3edff" stroke="#7356c8" stroke-width="1.8" filter="url(#shadow)"/><text x="720.0" y="420" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="800" fill="#7356c8">Event Counter</text><text x="720.0" y="456" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16" font-weight="550" fill="#4b5563">记录触发次数</text><rect x="880" y="380" width="255" height="110" rx="16" fill="#eef3ff" stroke="#2463d4" stroke-width="1.8" filter="url(#shadow)"/><text x="1007.5" y="420" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="800" fill="#2463d4">Scheduler Queue</text><text x="1007.5" y="456" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16" font-weight="550" fill="#4b5563">已激活 Event</text><rect x="480" y="610" width="285" height="105" rx="16" fill="#eefafa" stroke="#0f8f95" stroke-width="1.8" filter="url(#shadow)"/><text x="622.5" y="650" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="800" fill="#0f8f95">Scheduler</text><text x="622.5" y="686" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="16" font-weight="550" fill="#4b5563">选择并分发下一批 Task</text><circle cx="125" cy="260" r="20" fill="#2463d4" stroke="none" stroke-width="0"/><text x="125" y="267" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" font-weight="800" fill="#fff">1</text><text x="157" y="253" text-anchor="start" font-family="Noto Sans CJK SC" font-size="17" font-weight="650" fill="#374151"><tspan x="157" dy="0">Worker 从 Queue</tspan><tspan x="157" dy="23">取出 Task</tspan></text><circle cx="420" cy="245" r="20" fill="#2463d4" stroke="none" stroke-width="0"/><text x="420" y="252" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" font-weight="800" fill="#fff">2</text><text x="452" y="238" text-anchor="start" font-family="Noto Sans CJK SC" font-size="17" font-weight="650" fill="#374151"><tspan x="452" dy="0">若依赖未满足</tspan><tspan x="452" dy="23">等待 Event</tspan></text><circle cx="470" cy="330" r="20" fill="#0f8f95" stroke="none" stroke-width="0"/><text x="470" y="337" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" font-weight="800" fill="#fff">3</text><text x="502" y="323" text-anchor="start" font-family="Noto Sans CJK SC" font-size="17" font-weight="650" fill="#374151"><tspan x="502" dy="0">执行 Task</tspan><tspan x="502" dy="23">计算或通信</tspan></text><circle cx="730" cy="245" r="20" fill="#7356c8" stroke="none" stroke-width="0"/><text x="730" y="252" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" font-weight="800" fill="#fff">4</text><text x="762" y="238" text-anchor="start" font-family="Noto Sans CJK SC" font-size="17" font-weight="650" fill="#374151"><tspan x="762" dy="0">完成后触发 Event</tspan><tspan x="762" dy="23">计数加一</tspan></text><circle cx="980" cy="260" r="20" fill="#2463d4" stroke="none" stroke-width="0"/><text x="980" y="267" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" font-weight="800" fill="#fff">5</text><text x="1012" y="253" text-anchor="start" font-family="Noto Sans CJK SC" font-size="17" font-weight="650" fill="#374151"><tspan x="1012" dy="0">Event 达到阈值</tspan><tspan x="1012" dy="23">进入 Scheduler Queue</tspan></text><circle cx="530" cy="760" r="20" fill="#0f8f95" stroke="none" stroke-width="0"/><text x="530" y="767" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" font-weight="800" fill="#fff">6</text><text x="562" y="753" text-anchor="start" font-family="Noto Sans CJK SC" font-size="17" font-weight="650" fill="#374151"><tspan x="562" dy="0">Scheduler 将下一批 Task</tspan><tspan x="562" dy="23">分发回 Worker Queue</tspan></text><line x1="315" y1="435" x2="346" y2="435" stroke="#2463d4" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="560" y1="435" x2="600" y2="435" stroke="#7356c8" stroke-width="3" marker-end="url(#arrow-purple)" stroke-dasharray="6 5"/><line x1="835" y1="435" x2="875" y2="435" stroke="#2463d4" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M1005 495 C1005 565, 825 655, 770 655" fill="none" stroke="#0f8f95" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M480 655 C315 655, 190 585, 190 495" fill="none" stroke="#0f8f95" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M465 378 C500 310, 700 310, 720 378" fill="none" stroke="#7356c8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><text x="1400" y="205" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="850" fill="#0f777c">为什么重要</text><rect x="1260" y="245" width="282" height="100" rx="16" fill="#fff" stroke="#0f8f95" stroke-width="1.4"/><circle cx="1300" cy="295" r="27" fill="#0f8f95" stroke="none" stroke-width="0"/><text x="1300" y="304" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="23" font-weight="850" fill="#fff">✓</text><text x="1340" y="283" text-anchor="start" font-family="Noto Sans CJK SC" font-size="19" font-weight="800" fill="#0f8f95">任务常驻于 GPU</text><text x="1340" y="315" text-anchor="start" font-family="Noto Sans CJK SC" font-size="14" font-weight="550" fill="#4b5563">减少 CPU 往返与调度延迟</text><rect x="1260" y="375" width="282" height="100" rx="16" fill="#fff" stroke="#2463d4" stroke-width="1.4"/><circle cx="1300" cy="425" r="27" fill="#2463d4" stroke="none" stroke-width="0"/><text x="1300" y="434" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="23" font-weight="850" fill="#fff">✓</text><text x="1340" y="413" text-anchor="start" font-family="Noto Sans CJK SC" font-size="19" font-weight="800" fill="#2463d4">事件驱动调度</text><text x="1340" y="445" text-anchor="start" font-family="Noto Sans CJK SC" font-size="14" font-weight="550" fill="#4b5563">用计数精确维护依赖</text><rect x="1260" y="505" width="282" height="100" rx="16" fill="#fff" stroke="#258d52" stroke-width="1.4"/><circle cx="1300" cy="555" r="27" fill="#258d52" stroke="none" stroke-width="0"/><text x="1300" y="564" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="23" font-weight="850" fill="#fff">✓</text><text x="1340" y="543" text-anchor="start" font-family="Noto Sans CJK SC" font-size="19" font-weight="800" fill="#258d52">动态 Batch / KV Cache</text><text x="1340" y="575" text-anchor="start" font-family="Noto Sans CJK SC" font-size="14" font-weight="550" fill="#4b5563">运行时更新请求与缓存元数据</text><rect x="1260" y="635" width="282" height="100" rx="16" fill="#fff" stroke="#7356c8" stroke-width="1.4"/><circle cx="1300" cy="685" r="27" fill="#7356c8" stroke="none" stroke-width="0"/><text x="1300" y="694" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="23" font-weight="850" fill="#fff">✓</text><text x="1340" y="673" text-anchor="start" font-family="Noto Sans CJK SC" font-size="19" font-weight="800" fill="#7356c8">连续生成 Token</text><text x="1340" y="705" text-anchor="start" font-family="Noto Sans CJK SC" font-size="14" font-weight="550" fill="#4b5563">一轮结束后直接进入下一轮</text><rect x="100" y="820" width="1400" height="52" rx="22" fill="#eef4ff" stroke="#6d9fe4" stroke-width="1.2"/><text x="800" y="853" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="21" font-weight="800" fill="#2458af">论文关键点：不仅融合计算，还把部分请求调度与 KV Cache 管理搬进 GPU 内部</text></svg>