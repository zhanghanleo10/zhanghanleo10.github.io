<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="66" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#0f172a">simpler L2 生产运行时：边构图、边调度、边回收</text>
  <text x="800" y="106" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#475569">tensormap_and_ringbuffer（PTO2 / TRB）运行在 AICPU，AIC/AIV 常驻等待任务</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="80" y="160" rx="22" width="350" height="590" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="255" y="205" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">Host Runtime</text>
    <rect x="125" y="245" rx="16" width="260" height="68" fill="#dbeafe"/>
    <text x="255" y="275" text-anchor="middle" font-size="20" font-weight="700" fill="#1e40af">加载三类程序</text>
    <text x="255" y="300" text-anchor="middle" font-size="16" fill="#1e40af">Host .so / AICPU .so / AICore .o</text>
    <rect x="125" y="335" rx="16" width="260" height="68" fill="#dbeafe"/>
    <text x="255" y="365" text-anchor="middle" font-size="20" font-weight="700" fill="#1e40af">分配与绑定</text>
    <text x="255" y="390" text-anchor="middle" font-size="16" fill="#1e40af">Tensor · Callable · Runtime Buffer</text>
    <rect x="125" y="425" rx="16" width="260" height="68" fill="#dbeafe"/>
    <text x="255" y="455" text-anchor="middle" font-size="20" font-weight="700" fill="#1e40af">启动设备程序</text>
    <text x="255" y="480" text-anchor="middle" font-size="16" fill="#1e40af">AICore 先启动，AICPU 后运行</text>
    <rect x="125" y="535" rx="16" width="260" height="122" fill="#ffffff" stroke="#93c5fd"/>
    <text x="255" y="570" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">一次 Run 的外部边界</text>
    <text x="255" y="600" text-anchor="middle" font-size="16" fill="#475569">输入拷入 → 执行 → 结果拷回</text>
    <text x="255" y="628" text-anchor="middle" font-size="16" fill="#475569">当前默认占用整张设备</text>
    <rect x="475" y="135" rx="22" width="660" height="665" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="805" y="180" text-anchor="middle" font-size="31" font-weight="700" fill="#155e75">AICPU：Orchestrator + Scheduler</text>
    <rect x="520" y="220" rx="18" width="570" height="118" fill="#cffafe"/>
    <text x="805" y="255" text-anchor="middle" font-size="23" font-weight="700" fill="#155e75">Orchestrator Thread</text>
    <text x="805" y="286" text-anchor="middle" font-size="17" fill="#0e7490">提交 Task · 根据 Tensor INPUT/OUTPUT 推导依赖 · 创建中间 Tensor</text>
    <text x="805" y="313" text-anchor="middle" font-size="17" fill="#0e7490">TaskRing / HeapRing 满时背压，允许构图与执行并行</text>
    <rect x="520" y="365" rx="18" width="570" height="182" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
    <text x="805" y="402" text-anchor="middle" font-size="23" font-weight="700" fill="#155e75">共享 GM 元数据</text>
    <rect x="550" y="430" rx="10" width="118" height="80" fill="#e0f2fe"/><text x="609" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">TaskRing</text><text x="609" y="489" text-anchor="middle" font-size="14" fill="#0c4a6e">Task Slot</text>
    <rect x="680" y="430" rx="10" width="118" height="80" fill="#dcfce7"/><text x="739" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">HeapRing</text><text x="739" y="489" text-anchor="middle" font-size="14" fill="#166534">中间 Buffer</text>
    <rect x="810" y="430" rx="10" width="118" height="80" fill="#fef3c7"/><text x="869" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">DepPool</text><text x="869" y="489" text-anchor="middle" font-size="14" fill="#92400e">Fanin/Fanout</text>
    <rect x="940" y="430" rx="10" width="118" height="80" fill="#ede9fe"/><text x="999" y="463" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">TensorMap</text><text x="999" y="489" text-anchor="middle" font-size="14" fill="#5b21b6">Region→Producer</text>
    <rect x="520" y="575" rx="18" width="570" height="180" fill="#cffafe"/>
    <text x="805" y="610" text-anchor="middle" font-size="23" font-weight="700" fill="#155e75">Scheduler Threads</text>
    <text x="805" y="640" text-anchor="middle" font-size="17" fill="#0e7490">先处理 Completion，再从按资源 Shape 分类的 Ready Queue 分发</text>
    <text x="805" y="668" text-anchor="middle" font-size="17" fill="#0e7490">AIC_ONLY · AIV_X1/X2 · MIX · sync_start · Early Dispatch</text>
    <text x="805" y="696" text-anchor="middle" font-size="17" fill="#0e7490">完成后释放下游依赖并推进 Ring 水位</text>
    <text x="805" y="724" text-anchor="middle" font-size="17" fill="#0e7490">默认 3 Scheduler + 1 Orchestrator</text>
    <rect x="1180" y="160" rx="22" width="340" height="590" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="1350" y="205" text-anchor="middle" font-size="30" font-weight="700" fill="#166534">AICore Workers</text>
    <rect x="1225" y="250" rx="16" width="250" height="110" fill="#dcfce7"/><text x="1350" y="288" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">AIC</text><text x="1350" y="320" text-anchor="middle" font-size="17" fill="#15803d">MatMul / Cube Task</text>
    <rect x="1225" y="390" rx="16" width="250" height="110" fill="#dcfce7"/><text x="1350" y="428" text-anchor="middle" font-size="24" font-weight="700" fill="#166534">AIV</text><text x="1350" y="460" text-anchor="middle" font-size="17" fill="#15803d">Norm / Softmax / Vector</text>
    <rect x="1225" y="530" rx="16" width="250" height="110" fill="#ffffff" stroke="#86efac"/><text x="1350" y="568" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">MIX Cohort</text><text x="1350" y="600" text-anchor="middle" font-size="16" fill="#15803d">1 AIC + 1/2 AIV 协同</text><text x="1350" y="627" text-anchor="middle" font-size="16" fill="#15803d">可要求同时启动</text>
    <text x="1350" y="700" text-anchor="middle" font-size="16" fill="#475569">常驻轮询 Task Payload</text><text x="1350" y="727" text-anchor="middle" font-size="16" fill="#475569">执行 PTO Kernel 后写回完成状态</text>
  </g>
  <g stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"><line x1="430" y1="460" x2="465" y2="460"/><line x1="1135" y1="455" x2="1170" y2="455"/></g>
  <path d="M1180,675 C1080,835 650,850 515,755" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="820" y="855" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#166534">Completion：AIC/AIV → AICPU，释放 Fanout、回收 Task Slot 与中间 Buffer</text>
</svg>
